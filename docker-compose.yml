
services: 
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    working_dir: /app
    env_file:
      - ./backend/.env
    depends_on:
      - db
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app 
      - /app/node_modules
    working_dir: /app
    env_file:
      - ./frontend/.env
    depends_on:
      - backend

  db:
    image: postgres:16
    restart: always
    env_file:
      - ./backend/.env
    
